<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>flash</title>
  <!-- flash: one index card on the desk, front on, one line of it highlighted. Colours are the app's tokens; the
       highlighter is translucent, as on the cards. The card keeps inside the centre 80 % of the square, the safe zone
       of a masked Android icon; scripts/icons.ts renders the PNGs, scaling the card down a little more for the
       maskable one. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#11131A" />
  <g id="card">
    <rect x="64" y="150" width="384" height="240" rx="20" fill="#000" opacity=".5" filter="url(#shadow)" />
    <rect x="64" y="136" width="384" height="240" rx="20" fill="#FFFDF6" />
    <path d="M90 190H422" stroke="#EE5D6C" stroke-width="9" />
    <path d="M100 256H412M100 320H412" stroke="#A9CBEA" stroke-width="6" />
    <path d="M128 236C140 222 300 220 326 228L320 268C290 276 150 278 134 266Z" fill="#FFF04D" opacity=".9" style="mix-blend-mode:multiply" />
  </g>
</svg>
